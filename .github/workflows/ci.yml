name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build & test
        working-directory: day01-agent-core
        run: mvn -B -ntp verify

  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [web-vue, web-react]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: day01-agent-core/${{ matrix.app }}/package-lock.json
      - name: Install & build
        working-directory: day01-agent-core/${{ matrix.app }}
        run: |
          npm ci
          npm run build
